name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  release:
    name: Release x64
    # The image carries Visual Studio 2026, so the project's own v145 toolset and its
    # 10.0.26100.0 SDK are both present. No toolset override.
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: >
          msbuild Sunrise.sln /m
          /p:Configuration=Release
          /p:Platform=x64
          /verbosity:minimal

      - name: Configure regression tests
        run: cmake -S tests -B build/tests -G "Visual Studio 18 2026" -A x64

      - name: Build regression tests
        run: cmake --build build/tests --config Release

      - name: Run regression tests
        run: ctest --test-dir build/tests -C Release --output-on-failure

      - name: Package release
        run: ./tools/package-release.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tower-Events-At-Sunrise-Release-x64
          path: |
            build/Tower-Events-At-Sunrise-*-win64.zip
          if-no-files-found: error
